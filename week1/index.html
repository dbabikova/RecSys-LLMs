<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Lunch Menu Generator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="title"><i class="fa-solid fa-utensils" aria-hidden="true"></i> Random Lunch Menu</h1>
    <p class="subtitle">Can't decide what to eat? Let luck decide!</p>

    <div class="card">
      <i class="fa-solid fa-pizza-slice dish-icon" id="dishIcon" aria-hidden="true"></i>
      <h2 class="dish-name" id="dishName">Click the button!</h2>
      <span class="dish-tag" id="dishTag">Your choices await</span>
    </div>

    <button class="generate-btn" id="generateBtn" type="button"><i class="fa-solid fa-dice" aria-hidden="true"></i> Generate Lunch!</button>

    <p class="freq-note">Hungry? Click the button again.</p>
  </main>

  <footer class="footer">
    <p>Made with ❤️ · Randomly generated picks from <span id="menuCount">0</span> dishes</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
