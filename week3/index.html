<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User-Based &amp; Item-Based Collaborative Filtering</title>
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
    <div class="container">
        <header>
            <h1>User-Based &amp; Item-Based Collaborative Filtering</h1>
        </header>

        <main>
            <section class="controls">
                <div class="input-group">
                    <label for="user-input">Select user</label>
                    <div class="combobox">
                        <input type="text" id="user-input" class="combobox-input" role="combobox"
                            aria-expanded="false" aria-controls="user-list" aria-autocomplete="list"
                            autocomplete="off" spellcheck="false" placeholder="User id, e.g. 196" disabled>
                        <ul class="combobox-list" id="user-list" role="listbox" aria-label="User matches" hidden></ul>
                    </div>
                </div>

                <div class="input-group">
                    <label for="movie-input">Select movie</label>
                    <div class="combobox">
                        <input type="text" id="movie-input" class="combobox-input" role="combobox"
                            aria-expanded="false" aria-controls="movie-list" aria-autocomplete="list"
                            autocomplete="off" spellcheck="false" placeholder="Movie title, e.g. Godfather" disabled>
                        <ul class="combobox-list" id="movie-list" role="listbox" aria-label="Movie matches" hidden></ul>
                    </div>
                </div>

                <div class="actions">
                    <button id="predict-btn" onclick="predictRating()" disabled>Predict Rating</button>
                </div>
            </section>

            <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>

            <div id="status" class="status">Loading MovieLens 100K data...</div>

            <p id="prediction-context" class="context">No user and movie selected yet</p>

            <section class="results">
                <article class="result-card" id="card-user">
                    <p class="result-headline" id="user-headline">User-Based CF: -- predicted</p>
                    <p class="score"><span id="user-score">--</span> <span class="score-max">/ 5</span></p>
                    <p class="result-title" id="user-verdict">Pick a user and a movie</p>
                    <div class="meter"><div class="meter-fill" id="user-meter"></div></div>
                </article>

                <article class="result-card" id="card-item">
                    <p class="result-headline" id="item-headline">Item-Based CF: -- predicted</p>
                    <p class="score"><span id="item-score">--</span> <span class="score-max">/ 5</span></p>
                    <p class="result-title" id="item-verdict">Pick a user and a movie</p>
                    <div class="meter"><div class="meter-fill" id="item-meter"></div></div>
                </article>
            </section>
        </main>
    </div>

    <script src="data.js?v=8"></script>
    <script src="cf.js?v=8"></script>
    <script src="script.js?v=8"></script>
</body>
</html>
