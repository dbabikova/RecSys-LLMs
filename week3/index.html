<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Factorization Movie Recommender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Matrix Factorization Movie Recommender</h1>
            <p>Collaborative filtering with TensorFlow.js - loads pre-trained weights, and can be retrained in your browser</p>
        </header>

        <main>
            <section class="controls">
                <div class="input-group">
                    <label for="user-select">Select user</label>
                    <select id="user-select" disabled>
                        <option value="">Loading users...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="movie-select">Select movie</label>
                    <select id="movie-select" disabled>
                        <option value="">Loading movies...</option>
                    </select>
                </div>

                <div class="actions">
                    <button id="predict-btn" onclick="predictRating()" disabled>Predict Rating</button>
                    <button id="retrain-btn" class="secondary" onclick="retrainModel()" disabled>Retrain in browser</button>
                </div>
            </section>

            <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>

            <div id="status" class="status">Loading MovieLens 100K data...</div>

            <div id="result" class="result">
                Pick a user and a movie, then press <strong>Predict Rating</strong>.
            </div>

            <div id="stats" class="stats"></div>
        </main>

        <footer>MovieLens 100K &middot; u.item + u.data &middot; no server, no build step</footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
